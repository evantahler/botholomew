name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Cache the embedding model weights so the suite doesn't re-download them
      # from HuggingFace every run. Without this, repeated CI traffic from
      # GitHub's runner IP range trips HF's 429 rate limit and every
      # embedder-touching test fails. Keyed on package.json so a membot bump
      # (which owns the model name) busts the cache. MEMBOT_MODEL_CACHE_DIR
      # redirects the tests' cache dir (see test/setup.ts) to this one shared,
      # cached location.
      - uses: actions/cache@v4
        with:
          path: ~/.membot/models
          key: membot-models-${{ hashFiles('package.json') }}
      - run: bun install --frozen-lockfile
      - name: bun test
        run: |
          export MEMBOT_MODEL_CACHE_DIR="$HOME/.membot/models"
          mkdir -p "$MEMBOT_MODEL_CACHE_DIR"
          bun test --timeout 30000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run docs:build

  build-binary:
    # Compile the standalone binary and smoke-test it on every target platform,
    # from a dir with no node_modules (proves it's self-contained). Mirrors the
    # release matrix, so a broken platform is caught here before it ships.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64, ext: "" }
          - { os: ubuntu-latest, target: linux-x64, ext: "" }
          - { os: windows-latest, target: windows-x64, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Smoke-test the binary
        run: |
          BIN="$PWD/dist/bothy${{ matrix.ext }}"
          cd "$RUNNER_TEMP"
          "$BIN" --version
          "$BIN" --help
          "$BIN" -d "$RUNNER_TEMP/proj" init </dev/null

  complete:
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, docs-build, build-binary]
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed"
