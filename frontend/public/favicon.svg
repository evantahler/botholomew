<!--
  Botholomew favicon: the owl from the v1 terminal's `{o,o}`, drawn as pixels
  so it survives being scaled to 16px in a browser tab — two round eyes, a beak,
  ear tufts, and feet.

  Ground and colors are baked in rather than inherited: a favicon renders
  outside the page, so `currentColor` has nothing to pick up. The opaque ground
  square keeps it legible in both a light and a dark browser chrome. Every edge
  lands on an even coordinate of a 32-unit grid, so at 16px each unit pair maps
  to one device pixel and nothing blurs. The colors are the slate theme's
  ground, accent, link-hover, heading, and warning tokens.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  width="32"
  height="32"
  shape-rendering="crispEdges"
>
  <!-- Ground -->
  <rect width="32" height="32" fill="#06070a" />

  <g fill="#8b7cff">
    <!-- Ear tufts -->
    <rect x="6" y="4" width="4" height="2" />
    <rect x="22" y="4" width="4" height="2" />
    <!-- Head and body -->
    <rect x="6" y="6" width="20" height="18" />
    <rect x="8" y="24" width="16" height="2" />
    <!-- Feet -->
    <rect x="10" y="26" width="4" height="2" />
    <rect x="18" y="26" width="4" height="2" />
  </g>

  <!-- Belly -->
  <rect x="12" y="20" width="8" height="4" fill="#b4a9ff" />

  <!-- Eyes -->
  <g fill="#e9eff8">
    <rect x="8" y="8" width="6" height="6" />
    <rect x="18" y="8" width="6" height="6" />
  </g>
  <g fill="#06070a">
    <rect x="10" y="10" width="2" height="2" />
    <rect x="20" y="10" width="2" height="2" />
  </g>

  <!-- Beak -->
  <rect x="14" y="14" width="4" height="4" fill="#fbbf24" />
</svg>
